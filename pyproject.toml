[project]
name = "blackglass"
version = "0.0.1"
description = "Web3 security confirmation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blackglass = "blackglass.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackglass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
