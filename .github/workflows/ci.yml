name: ci

on:
  push:
  pull_request:

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the lab image
        run: docker build -t blackglass-lab -f docker/Dockerfile .

      - name: Run pytest, forge test, and the Anvil smoke check
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/work"
          -w /work
          -e PYTHONPATH=/work/src
          -e PATH="/opt/foundry/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          blackglass-lab
          bash -c "pytest && forge test --root lab/smoke && bash scripts/smoke-anvil.sh && bash scripts/mutation-check.sh && python -m blackglass.cli lab test && python -m blackglass.cli corpus score"
